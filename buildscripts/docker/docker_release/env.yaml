name: base
channels:
  - conda-forge
  - bodo.ai
dependencies:
  - python=3.15
  - bodo
  - bodosql
  - jupyterlab=3
  - setuptools
  # To test and run notebooks
  - nbconvert
  # Required for PyIceberg since no 3.15 wheel yet.
  # TODO: Remove once PyIceberg has a 3.15 wheel available.
  - zstandard
  - pip
  - pip:
    - pyiceberg >= 0.9
