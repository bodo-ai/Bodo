name: base
channels:
  - conda-forge
  - bodo.ai
dependencies:
  - python=3.15
  - bodo
  - bodosql
  - jupyterlab=3
  - jupyter_client>=8.6.3
  - setuptools
  # To test and run notebooks
  - nbconvert
  # Required for PyIceberg since no 3.15 wheel yet.
  # TODO: Remove when PyIceberg has a 3.15 wheel/conda-forge package available.
  - zstandard
  - pip
  - pip:
    - pyiceberg >= 0.9
